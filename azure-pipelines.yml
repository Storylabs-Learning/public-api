trigger:
- main

resources: 
- repo: self

variables:
  tag: '$(Build.BuildId)' # Azure!!!!
  imageName: 'public-api'
  vmImageName: ubuntu-latest

stages:
  - stage: Build
    displayName: Build image
    jobs:
      - job:
        displayName: Build
        pool:
          vmImage: $(vmImageName)

        steps:
        - task: Docker@2
          displayName: Build image
          inputs:
            repository: $(imageName)
            command: build
            dockerfile: '**/qa.dockerfile'
            tags: $(tag)


      
      